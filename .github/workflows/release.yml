name: CI & Release

# Test on all three platforms, then publish the npm package (`@kw-yeh/vibeflow`, with
# provenance).
# Trigger: push a tag like `v0.1.0` (must match the version in package.json),
# or run manually from the Actions tab (workflow_dispatch tests and builds but
# does not publish). Pull requests run the test job only.
on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

# A new push to a PR supersedes the run for its previous commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default (pull requests included); jobs that publish widen it.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # package-lock.json is generated by npm 11 locally; npm 10 (bundled with
      # Node 22) rejects its bundleDependencies layout (`npm ci` reports
      # "Missing: @emnapi/* from lock file"). Keep CI on the same npm major.
      - name: Pin npm 11
        run: npm install -g npm@11

      # So TmuxBackend's real-tmux test runs instead of skipping.
      - name: Install tmux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Install tmux
        if: runner.os == 'macOS'
        run: brew install tmux

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: |
          npx tsc --noEmit -p tsconfig.json
          npx tsc --noEmit -p renderer/tsconfig.json

      - name: Unit, integration and security tests
        run: npm test

      # Runners have no Turbopack-friendly IPC; build with webpack.
      - name: Build the Web UI
        run: npm run build:web -- --webpack

      # Playwright drives the runner's preinstalled Chrome / Edge.
      - name: End-to-end (Web UI + fake agent)
        run: npm run test:e2e

      # No claude/codex on the runner.
      - name: vibeflow doctor
        run: npm run doctor -- --skip agents

  npm-package:
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Pin npm 11
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Stage the package
        run: |
          npm run build:web -- --webpack
          npm run build:npm

      # What a user gets: pack, install globally from the tarball in a clean
      # prefix, and start it.
      - name: Install from the tarball and run it
        shell: bash
        run: |
          TARBALL=$(npm pack ./dist-npm --pack-destination "$RUNNER_TEMP" | tail -n 1)
          npm i -g --prefix "$RUNNER_TEMP/prefix" "$RUNNER_TEMP/$TARBALL"
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="$RUNNER_TEMP/prefix"; else BIN="$RUNNER_TEMP/prefix/bin"; fi
          "$BIN/vibeflow" --version
          "$BIN/vibeflow" doctor --skip agents --store-path "$RUNNER_TEMP/store"

      - name: Publish to npm
        if: github.ref_type == 'tag' && runner.os == 'Linux'
        run: npm publish ./dist-npm --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
